<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseWise — CAPEX/OPEX Categorization Tool</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── Data ──────────────────────────────────────────────────────────────────

    const TEAMS = [
      { value: 'product_area_works',    label: 'Product Area Works',      code: '01' },
      { value: 'advanced_scheduling',   label: 'Advanced Scheduling',     code: '03' },
      { value: 'order_inflow_closure',  label: 'Order Inflow / Closure',  code: '04' },
      { value: 'maintenance_execution', label: 'Maintenance & Execution', code: '05' },
      { value: 'service_foundation',    label: 'Service Foundation',      code: '08' },
      { value: 'virtual_technician',    label: 'Virtual Technician',      code: '09' },
      { value: 'ai_big_bets',           label: 'AI Big Bets',             code: '10' },
    ];

    const SYSTEM_TYPES = [
      { value: 'company_managed',  label: 'Company Managed System' },
      { value: 'onprem_iaas_paas', label: 'On-Premise / IaaS / PaaS'  },
      { value: 'saas',             label: 'SaaS'                       },
    ];

    const ASSIGNMENT_OPTIONS = [
      { value: 'dev_capex',   label: 'Development (CAPEX)'    },
      { value: 'dev_opex',    label: 'Development (OPEX)'     },
      { value: 'operations',  label: 'Operations / Support'   },
      { value: 'op_purchase', label: 'Operational Purchase'   },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────

    function deriveWBS(teamCode, finalCategory, assignmentType) {
      if (!teamCode) return null;
      const base = `DS-53010-${teamCode}`;
      if (assignmentType === 'op_purchase') return `${base}-04-XX`;
      if (teamCode === '01')               return `${base}-03`;   // Product Area Works — operations only
      if (assignmentType === 'operations') return `${base}-03`;
      if (finalCategory === 'CAPEX')       return `${base}-01`;
      if (finalCategory === 'OPEX')        return `${base}-02`;
      return null;
    }

    function runAIEngine(form) {
      const {
        isProductTeam, isDevelopmentWork, developmentSystemType, assignmentDetails,
        isResourceForecasted, forecastedDevelopmentWork, forecastedSystemType, forecastedAssignmentDetails,
      } = form;

      const activeAssign = isProductTeam === 'yes' ? assignmentDetails : forecastedAssignmentDetails;
      if (activeAssign === 'op_purchase') return null;   // bypass

      const devWork  = isProductTeam === 'yes' ? isDevelopmentWork       : forecastedDevelopmentWork;
      const sysType  = isProductTeam === 'yes' ? developmentSystemType   : forecastedSystemType;

      if ((isProductTeam === 'yes' || isResourceForecasted === 'yes') && devWork === 'yes') {
        if (sysType === 'company_managed' || sysType === 'onprem_iaas_paas') {
          return { category: 'CAPEX', confidence: 85, reasoning: 'Company-managed and on-premise systems create long-term capitalizable assets per finance policy.' };
        }
        if (sysType === 'saas') {
          return { category: 'OPEX', confidence: 80, reasoning: 'SaaS development work is classified as operational expenditure per finance policy.' };
        }
      }

      if (isResourceForecasted === 'yes' && forecastedDevelopmentWork === 'yes') {
        return { category: 'CAPEX', confidence: 90, reasoning: 'Forecasted development resources allocated to a product team are classified as capital expenditure.' };
      }

      if (devWork === 'no') {
        return { category: 'OPEX', confidence: 90, reasoning: 'Operations and support activities are classified as operational expenditure.' };
      }

      return { category: 'OPEX', confidence: 75, reasoning: 'Based on operational characteristics, this entry is classified as operational expenditure.' };
    }

    // ── Primitive UI components ───────────────────────────────────────────────

    function Field({ label, required, visible = true, error, children }) {
      if (!visible) return null;
      return (
        <div className="mb-5">
          <label className="block text-sm font-semibold text-gray-700 mb-1.5">
            {label}{required && <span className="text-red-500 ml-0.5">*</span>}
          </label>
          {children}
          {error && <p className="text-xs text-red-500 mt-1">{error}</p>}
        </div>
      );
    }

    function RadioGroup({ name, options, value, onChange }) {
      return (
        <div className="flex flex-wrap gap-4">
          {options.map(opt => (
            <label key={opt.value} className="flex items-center gap-2 cursor-pointer select-none">
              <input
                type="radio"
                name={name}
                value={opt.value}
                checked={value === opt.value}
                onChange={() => onChange(opt.value)}
                className="w-4 h-4 text-blue-600 accent-blue-600"
              />
              <span className="text-sm text-gray-700">{opt.label}</span>
            </label>
          ))}
        </div>
      );
    }

    function Select({ options, value, onChange, placeholder }) {
      return (
        <select
          value={value}
          onChange={e => onChange(e.target.value)}
          className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">{placeholder || 'Select…'}</option>
          {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      );
    }

    function Textarea({ value, onChange, placeholder, minLen }) {
      const ok = !minLen || value.length >= minLen;
      return (
        <div>
          <textarea
            value={value}
            onChange={e => onChange(e.target.value)}
            placeholder={placeholder}
            rows={3}
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
          />
          {minLen && (
            <p className={`text-xs mt-0.5 ${ok ? 'text-green-600' : 'text-gray-400'}`}>
              {value.length} / {minLen} characters minimum
            </p>
          )}
        </div>
      );
    }

    function Checkbox({ checked, onChange, children }) {
      return (
        <label className="flex items-start gap-3 cursor-pointer select-none">
          <input
            type="checkbox"
            checked={checked}
            onChange={e => onChange(e.target.checked)}
            className="w-4 h-4 mt-0.5 accent-blue-600"
          />
          <span className="text-sm text-gray-700">{children}</span>
        </label>
      );
    }

    // ── Confidence bar ────────────────────────────────────────────────────────

    function ConfidenceBar({ confidence, category }) {
      const isCapex = category === 'CAPEX';
      return (
        <div className={`rounded-lg p-3 mb-3 ${isCapex ? 'bg-blue-50' : 'bg-orange-50'}`}>
          <div className="flex items-center justify-between mb-2">
            <span className={`text-xl font-bold ${isCapex ? 'text-blue-700' : 'text-orange-700'}`}>{category}</span>
            <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${isCapex ? 'bg-blue-200 text-blue-800' : 'bg-orange-200 text-orange-800'}`}>
              {confidence}% confidence
            </span>
          </div>
          <div className="w-full bg-white/60 rounded-full h-2">
            <div
              className={`h-2 rounded-full transition-all duration-700 ${isCapex ? 'bg-blue-500' : 'bg-orange-500'}`}
              style={{ width: `${confidence}%` }}
            />
          </div>
        </div>
      );
    }

    // ── WBS badge ─────────────────────────────────────────────────────────────

    function WBSBadge({ code }) {
      if (!code) return null;
      return (
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3 mt-4">
          <p className="text-xs text-gray-400 mb-0.5">Derived WBS Code</p>
          <p className="font-mono font-bold text-gray-900 text-sm tracking-wide">{code}</p>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────

    const EMPTY_FORM = {
      employeeType: '',
      isProductTeam: '',
      // Path A
      specificProductTeam: '',
      isDevelopmentWork: '',
      developmentSystemType: '',
      assignmentDetails: '',
      // Path B
      isResourceForecasted: '',
      forecastedProductTeam: '',
      forecastedDevelopmentWork: '',
      forecastedSystemType: '',
      forecastedAssignmentDetails: '',
      isPlatformTeamStandingCapacity: '',
      // Path B2
      taskPerformed: '',
      priorApprovalConfirmed: false,
      vmsManaged: '',
      assignmentDetailsTextarea: '',
      // External
      ensureRatesMatch: false,
      // Override
      overrideCategory: '',
      overrideReason: '',
    };

    function App() {
      const [form, setForm] = useState(EMPTY_FORM);
      const [aiResult, setAiResult]       = useState(null);
      const [aiLoading, setAiLoading]     = useState(false);
      const [showResult, setShowResult]   = useState(false);
      const [submitted, setSubmitted]     = useState(false);
      const [errors, setErrors]           = useState({});

      // Patched setter — resets downstream on key changes
      function set(field, value) {
        setErrors({});
        setShowResult(false);
        setAiResult(null);
        setForm(prev => {
          const f = { ...prev, [field]: value };
          if (field === 'employeeType')         return { ...EMPTY_FORM, employeeType: value };
          if (field === 'isProductTeam')        return { ...EMPTY_FORM, employeeType: f.employeeType, isProductTeam: value };
          if (field === 'isDevelopmentWork')    return { ...f, developmentSystemType: '', assignmentDetails: '', overrideCategory: '', overrideReason: '' };
          if (field === 'isResourceForecasted') return { ...f, forecastedProductTeam: '', forecastedDevelopmentWork: '', forecastedSystemType: '', forecastedAssignmentDetails: '', isPlatformTeamStandingCapacity: '', taskPerformed: '', priorApprovalConfirmed: false, vmsManaged: '', assignmentDetailsTextarea: '', ensureRatesMatch: false, overrideCategory: '', overrideReason: '' };
          if (field === 'forecastedDevelopmentWork') return { ...f, forecastedSystemType: '', forecastedAssignmentDetails: '', overrideCategory: '', overrideReason: '' };
          return f;
        });
      }

      // Derived flags
      const ext               = form.employeeType === 'external';
      const pathA             = form.isProductTeam === 'yes';
      const pathB             = form.isProductTeam === 'no';
      const pathBForecasted   = pathB && form.isResourceForecasted === 'yes';
      const pathB2            = pathB && form.isResourceForecasted === 'no' && form.isPlatformTeamStandingCapacity === 'no';
      const pathB3Blocked     = pathB && form.isResourceForecasted === 'no' && form.isPlatformTeamStandingCapacity === 'yes';

      const activeAssign  = pathA ? form.assignmentDetails : pathBForecasted ? form.forecastedAssignmentDetails : '';
      const isOpPurchase  = activeAssign === 'op_purchase';

      const activeTeamVal = pathA ? form.specificProductTeam : pathBForecasted ? form.forecastedProductTeam : '';
      const activeTeam    = TEAMS.find(t => t.value === activeTeamVal);

      const overrideActive = aiResult && form.overrideCategory && form.overrideCategory !== aiResult.category;
      const finalCategory  = overrideActive ? form.overrideCategory : aiResult?.category;
      const wbsCode        = activeTeam
        ? deriveWBS(activeTeam.code, finalCategory, activeAssign)
        : null;

      const canAnalyze = (pathA && form.assignmentDetails && !isOpPurchase)
                      || (pathBForecasted && form.forecastedAssignmentDetails && !isOpPurchase);

      // ── Validation ──────────────────────────────────────────────────────────
      function validate() {
        const e = {};
        if (!form.employeeType)  e.employeeType  = 'Required';
        if (!form.isProductTeam) e.isProductTeam = 'Required';

        if (pathA) {
          if (!form.specificProductTeam)                                           e.specificProductTeam  = 'Required';
          if (!form.isDevelopmentWork)                                             e.isDevelopmentWork    = 'Required';
          if (form.isDevelopmentWork === 'yes' && !form.developmentSystemType)    e.developmentSystemType = 'Required';
          if (!form.assignmentDetails)                                             e.assignmentDetails    = 'Required';
          if (ext && !isOpPurchase && !form.ensureRatesMatch)                     e.ensureRatesMatch     = 'Rate confirmation required';
        }

        if (pathBForecasted) {
          if (!form.forecastedProductTeam)                                                  e.forecastedProductTeam     = 'Required';
          if (!form.forecastedDevelopmentWork)                                              e.forecastedDevelopmentWork = 'Required';
          if (form.forecastedDevelopmentWork === 'yes' && !form.forecastedSystemType)      e.forecastedSystemType       = 'Required';
          if (!form.forecastedAssignmentDetails)                                            e.forecastedAssignmentDetails = 'Required';
          if (ext && !isOpPurchase && !form.ensureRatesMatch)                              e.ensureRatesMatch           = 'Rate confirmation required';
        }

        if (pathB2) {
          if (!form.priorApprovalConfirmed)                      e.priorApprovalConfirmed = 'Required';
          if (ext && form.taskPerformed.length < 10)             e.taskPerformed          = 'Minimum 10 characters required';
        }

        if (aiResult && overrideActive && form.overrideReason.length < 10) {
          e.overrideReason = 'Minimum 10 characters required';
        }

        return e;
      }

      // ── Analyse button ──────────────────────────────────────────────────────
      function handleAnalyze() {
        setAiLoading(true);
        setShowResult(false);
        setTimeout(() => {
          const result = runAIEngine(form);
          setAiResult(result);
          setAiLoading(false);
          setShowResult(true);
          if (result) setForm(prev => ({ ...prev, overrideCategory: result.category }));
        }, 2000);
      }

      // ── Submit ──────────────────────────────────────────────────────────────
      function handleSubmit() {
        const e = validate();
        if (Object.keys(e).length > 0) { setErrors(e); return; }

        const payload = {
          ...form,
          finalCategory,
          wbsCode,
          aiSuggestion: aiResult,
          isOverridden: !!overrideActive,
          timestamp: new Date().toISOString(),
        };
        console.log('ExpenseWise — Submission Payload:', payload);

        setSubmitted(true);
        setTimeout(() => {
          setForm(EMPTY_FORM);
          setAiResult(null);
          setShowResult(false);
          setSubmitted(false);
          setErrors({});
        }, 1500);
      }

      // ── Render ──────────────────────────────────────────────────────────────
      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">

          {/* ── Header ── */}
          <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow">
                  <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                      d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01
                         M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-base font-bold text-gray-900 leading-tight">ExpenseWise</h1>
                  <p className="text-xs text-gray-400">CAPEX / OPEX Categorization Tool</p>
                </div>
              </div>
              <div className="flex items-center gap-2 text-xs text-gray-400">
                <span className="bg-gray-100 rounded px-2 py-0.5">v1.0</span>
                <span className="bg-yellow-100 text-yellow-700 rounded px-2 py-0.5 font-medium">Internal</span>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-6 py-8">

            {/* ── Success flash ── */}
            {submitted && (
              <div className="bg-green-50 border border-green-200 rounded-2xl p-10 text-center">
                <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg className="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                  </svg>
                </div>
                <h2 className="text-xl font-bold text-green-800">Submitted Successfully</h2>
                <p className="text-green-600 text-sm mt-1">Resetting form…</p>
              </div>
            )}

            {/* ── Main grid ── */}
            {!submitted && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

                {/* ── LEFT: Form ── */}
                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                  <h2 className="text-sm font-bold text-gray-500 uppercase tracking-widest mb-5 pb-3 border-b border-gray-100">
                    Classification Form
                  </h2>

                  {/* F1 — Employee type */}
                  <Field label="Employee Type" required error={errors.employeeType}>
                    <Select
                      options={[{ value: 'internal', label: 'Internal' }, { value: 'external', label: 'External (Contractor)' }]}
                      value={form.employeeType}
                      onChange={v => set('employeeType', v)}
                      placeholder="Select employee type…"
                    />
                  </Field>

                  {/* F2 — Product team? */}
                  <Field label="Are you part of a product team?" required visible={!!form.employeeType} error={errors.isProductTeam}>
                    <RadioGroup
                      name="isProductTeam"
                      options={[{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }]}
                      value={form.isProductTeam}
                      onChange={v => set('isProductTeam', v)}
                    />
                  </Field>

                  {/* ══ PATH A ══════════════════════════════════════════════ */}

                  {/* F3 — Specific product team */}
                  <Field label="Select your product team" required visible={pathA} error={errors.specificProductTeam}>
                    <Select options={TEAMS} value={form.specificProductTeam} onChange={v => set('specificProductTeam', v)} placeholder="Select product team…" />
                  </Field>

                  {/* F4 — Dev related? */}
                  <Field label="Is this work development related?" required visible={pathA && !!form.specificProductTeam} error={errors.isDevelopmentWork}>
                    <RadioGroup
                      name="isDevelopmentWork"
                      options={[{ value: 'yes', label: 'Yes — Development' }, { value: 'no', label: 'No — Operations / Support' }]}
                      value={form.isDevelopmentWork}
                      onChange={v => set('isDevelopmentWork', v)}
                    />
                  </Field>

                  {/* F5 — System type (direct) */}
                  <Field label="What type of system is this?" required visible={pathA && form.isDevelopmentWork === 'yes'} error={errors.developmentSystemType}>
                    <RadioGroup name="developmentSystemType" options={SYSTEM_TYPES} value={form.developmentSystemType} onChange={v => set('developmentSystemType', v)} />
                  </Field>

                  {/* F6 — Assignment details */}
                  <Field label="Assignment details" required visible={pathA && !!form.isDevelopmentWork} error={errors.assignmentDetails}>
                    <Select options={ASSIGNMENT_OPTIONS} value={form.assignmentDetails} onChange={v => set('assignmentDetails', v)} placeholder="Select assignment type…" />
                  </Field>

                  {/* F17 — Rate confirmation (External, Path A) */}
                  <Field label="Rate confirmation" required visible={pathA && ext && !isOpPurchase} error={errors.ensureRatesMatch}>
                    <Checkbox checked={form.ensureRatesMatch} onChange={v => set('ensureRatesMatch', v)}>
                      I confirm that the billing rate matches the agreed contract rate
                    </Checkbox>
                  </Field>

                  {/* ══ PATH B ══════════════════════════════════════════════ */}

                  {/* F7 — Forecasted? */}
                  <Field label="Is this resource forecasted on a product team?" required visible={pathB} error={errors.isResourceForecasted}>
                    <RadioGroup
                      name="isResourceForecasted"
                      options={[{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }]}
                      value={form.isResourceForecasted}
                      onChange={v => set('isResourceForecasted', v)}
                    />
                  </Field>

                  {/* F8 — Forecasted product team */}
                  <Field label="Select the forecasted product team" required visible={pathBForecasted} error={errors.forecastedProductTeam}>
                    <Select options={TEAMS} value={form.forecastedProductTeam} onChange={v => set('forecastedProductTeam', v)} placeholder="Select product team…" />
                  </Field>

                  {/* F9 — Dev work (forecasted) */}
                  <Field label="Is this work development related?" required visible={pathBForecasted && !!form.forecastedProductTeam} error={errors.forecastedDevelopmentWork}>
                    <RadioGroup
                      name="forecastedDevelopmentWork"
                      options={[{ value: 'yes', label: 'Yes — Development' }, { value: 'no', label: 'No — Operations / Support' }]}
                      value={form.forecastedDevelopmentWork}
                      onChange={v => set('forecastedDevelopmentWork', v)}
                    />
                  </Field>

                  {/* F10 — System type (forecasted) */}
                  <Field label="What type of system is this?" required visible={pathBForecasted && form.forecastedDevelopmentWork === 'yes'} error={errors.forecastedSystemType}>
                    <RadioGroup name="forecastedSystemType" options={SYSTEM_TYPES} value={form.forecastedSystemType} onChange={v => set('forecastedSystemType', v)} />
                  </Field>

                  {/* F11 — Assignment details (forecasted) */}
                  <Field label="Assignment details" required visible={pathBForecasted && !!form.forecastedDevelopmentWork} error={errors.forecastedAssignmentDetails}>
                    <Select options={ASSIGNMENT_OPTIONS} value={form.forecastedAssignmentDetails} onChange={v => set('forecastedAssignmentDetails', v)} placeholder="Select assignment type…" />
                  </Field>

                  {/* F17 — Rate confirmation (External, Path B-forecasted) */}
                  <Field label="Rate confirmation" required visible={pathBForecasted && ext && !isOpPurchase} error={errors.ensureRatesMatch}>
                    <Checkbox checked={form.ensureRatesMatch} onChange={v => set('ensureRatesMatch', v)}>
                      I confirm that the billing rate matches the agreed contract rate
                    </Checkbox>
                  </Field>

                  {/* F12 — Platform team standing capacity */}
                  <Field label="Is this resource on platform team standing capacity?" required visible={pathB && form.isResourceForecasted === 'no'}>
                    <RadioGroup
                      name="isPlatformTeamStandingCapacity"
                      options={[{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }]}
                      value={form.isPlatformTeamStandingCapacity}
                      onChange={v => set('isPlatformTeamStandingCapacity', v)}
                    />
                  </Field>

                  {/* F13 — Task performed (External + B2) */}
                  <Field label="Describe the task performed" required visible={pathB2 && ext} error={errors.taskPerformed}>
                    <Textarea value={form.taskPerformed} onChange={v => set('taskPerformed', v)} placeholder="Describe the task in detail…" minLen={10} />
                  </Field>

                  {/* F14 — Prior approval */}
                  <Field label="Prior approval confirmation" required visible={pathB2} error={errors.priorApprovalConfirmed}>
                    <Checkbox checked={form.priorApprovalConfirmed} onChange={v => set('priorApprovalConfirmed', v)}>
                      I confirm that prior approval has been obtained for this activity
                    </Checkbox>
                  </Field>

                  {/* F15 — VMS managed */}
                  <Field label="Is this a VMS-managed system?" visible={pathB2}>
                    <RadioGroup
                      name="vmsManaged"
                      options={[{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }]}
                      value={form.vmsManaged}
                      onChange={v => set('vmsManaged', v)}
                    />
                  </Field>

                  {/* F16 — Assignment details textarea */}
                  <Field label="Assignment details" visible={pathB2}>
                    <Textarea value={form.assignmentDetailsTextarea} onChange={v => set('assignmentDetailsTextarea', v)} placeholder="Describe the assignment details…" />
                  </Field>

                  {/* ── Analyse button ── */}
                  {canAnalyze && (
                    <div className="pt-2 border-t border-gray-100 mt-2">
                      <button
                        onClick={handleAnalyze}
                        disabled={aiLoading}
                        className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow-sm"
                      >
                        {aiLoading ? (
                          <>
                            <svg className="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            Analysing…
                          </>
                        ) : (
                          <>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3
                                   m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.362.362
                                   a1 1 0 01-1.414 0l-3.296-3.296a1 1 0 010-1.414l.362-.362z" />
                            </svg>
                            Get AI Suggestion
                          </>
                        )}
                      </button>
                    </div>
                  )}
                </div>

                {/* ── RIGHT: Result panel ── */}
                <div className="lg:col-span-1 space-y-4">

                  {/* State D — BLOCKED */}
                  {pathB3Blocked && (
                    <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-5">
                      <div className="flex items-center gap-2 mb-3">
                        <svg className="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                            d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                        </svg>
                        <h3 className="font-bold text-red-800">Submission Blocked</h3>
                      </div>
                      <p className="text-sm text-red-700 leading-relaxed">
                        Resources on platform team standing capacity cannot be submitted through this tool.
                        Please contact your Finance Business Partner directly.
                      </p>
                      <button disabled className="mt-4 w-full bg-red-200 text-red-400 py-2.5 rounded-xl text-sm font-semibold cursor-not-allowed">
                        Submit Disabled
                      </button>
                    </div>
                  )}

                  {/* State C — Platform Non-Standing (B2) */}
                  {pathB2 && (
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5">
                      <div className="flex items-center gap-2 mb-3">
                        <svg className="w-4 h-4 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                               M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        <h3 className="font-bold text-amber-900">Submission Summary</h3>
                      </div>

                      <div className="space-y-2 text-sm mb-4">
                        <div className="flex justify-between">
                          <span className="text-gray-500">Employee</span>
                          <span className="font-semibold capitalize">{form.employeeType}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-gray-500">Path</span>
                          <span className="font-semibold">Non-Standing Capacity</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-gray-500">Prior approval</span>
                          <span className={`font-semibold ${form.priorApprovalConfirmed ? 'text-green-700' : 'text-red-500'}`}>
                            {form.priorApprovalConfirmed ? 'Confirmed' : 'Pending'}
                          </span>
                        </div>
                      </div>

                      {!ext && (
                        <div className="bg-amber-100 rounded-lg p-2.5 text-xs text-amber-800 font-medium mb-3">
                          Internal: PAA confirmation required for WBS code assignment.
                        </div>
                      )}
                      {ext && (
                        <div className="bg-orange-100 rounded-lg p-2.5 text-xs text-orange-800 font-medium mb-3">
                          External: No WBS code will be assigned for this path.
                        </div>
                      )}

                      <button
                        onClick={handleSubmit}
                        disabled={!form.priorApprovalConfirmed || (ext && form.taskPerformed.length < 10)}
                        className="w-full bg-amber-600 hover:bg-amber-700 disabled:opacity-50 text-white py-2.5 rounded-xl text-sm font-semibold transition-colors"
                      >
                        Submit
                      </button>
                    </div>
                  )}

                  {/* State B — Operational Purchase */}
                  {isOpPurchase && activeTeam && (
                    <div className="bg-purple-50 border border-purple-200 rounded-2xl p-5">
                      <div className="flex items-center gap-2 mb-3">
                        <svg className="w-4 h-4 text-purple-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184
                               1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <h3 className="font-bold text-purple-900">Operational Purchase</h3>
                      </div>
                      <p className="text-xs text-purple-600 mb-3 leading-relaxed">
                        AI engine bypassed. WBS code derived directly from team and purchase type.
                      </p>
                      <WBSBadge code={deriveWBS(activeTeam.code, null, 'op_purchase')} />
                      <button onClick={handleSubmit} className="mt-4 w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl text-sm font-semibold transition-colors">
                        Submit
                      </button>
                    </div>
                  )}

                  {/* State A — Normal AI result */}
                  {showResult && aiResult && !isOpPurchase && (
                    <div className="bg-white border border-gray-100 rounded-2xl shadow-sm p-5">
                      <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 text-sm">
                        <svg className="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3
                               m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.362.362
                               a1 1 0 01-1.414 0l-3.296-3.296a1 1 0 010-1.414l.362-.362z" />
                        </svg>
                        AI Suggestion
                      </h3>

                      <ConfidenceBar confidence={aiResult.confidence} category={aiResult.category} />
                      <p className="text-xs text-gray-500 leading-relaxed mb-4">{aiResult.reasoning}</p>

                      {/* Override */}
                      <div className="border-t border-gray-100 pt-4">
                        <p className="text-xs font-semibold text-gray-600 mb-2">Override decision</p>
                        <RadioGroup
                          name="overrideCategory"
                          options={[{ value: 'CAPEX', label: 'CAPEX' }, { value: 'OPEX', label: 'OPEX' }]}
                          value={form.overrideCategory}
                          onChange={v => set('overrideCategory', v)}
                        />

                        {overrideActive && (
                          <div className="mt-3">
                            <p className="text-xs text-amber-600 font-semibold mb-1">Justification required:</p>
                            <Textarea
                              value={form.overrideReason}
                              onChange={v => set('overrideReason', v)}
                              placeholder="Explain why you are overriding the AI suggestion…"
                              minLen={10}
                            />
                            {errors.overrideReason && <p className="text-xs text-red-500 mt-1">{errors.overrideReason}</p>}
                          </div>
                        )}
                      </div>

                      <WBSBadge code={wbsCode} />

                      <button onClick={handleSubmit} className="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-semibold transition-colors">
                        Submit
                      </button>
                    </div>
                  )}

                  {/* Idle hint */}
                  {!pathB3Blocked && !pathB2 && !isOpPurchase && !showResult && (
                    <div className="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 text-center">
                      <div className="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg className="w-6 h-6 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                      </div>
                      <p className="text-sm text-gray-400 leading-relaxed">
                        Complete the form, then click <span className="font-semibold text-blue-500">Get AI Suggestion</span> to classify this entry.
                      </p>
                    </div>
                  )}

                </div>
              </div>
            )}
          </main>

          {/* ── WBS Reference table ── */}
          {!submitted && (
            <section className="max-w-5xl mx-auto px-6 pb-10">
              <details className="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <summary className="cursor-pointer px-6 py-4 text-sm font-semibold text-gray-600 hover:bg-gray-50 select-none list-none flex items-center gap-2">
                  <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M3 14h18M10 3v18M14 3v18" />
                  </svg>
                  WBS Code Reference Table
                </summary>
                <div className="px-6 pb-5 overflow-x-auto">
                  <table className="w-full text-xs border-collapse mt-2">
                    <thead>
                      <tr className="bg-gray-50">
                        <th className="text-left px-3 py-2 border border-gray-200 font-semibold text-gray-600">Product Team</th>
                        <th className="text-left px-3 py-2 border border-gray-200 font-semibold text-blue-700">Dev CAPEX</th>
                        <th className="text-left px-3 py-2 border border-gray-200 font-semibold text-orange-700">Dev OPEX</th>
                        <th className="text-left px-3 py-2 border border-gray-200 font-semibold text-gray-600">Operations</th>
                        <th className="text-left px-3 py-2 border border-gray-200 font-semibold text-purple-700">Op. Purchase</th>
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        ['Product Area Works',      '—',              '—',              'DS-53010-01-03', '—'],
                        ['Advanced Scheduling',     'DS-53010-03-01', 'DS-53010-03-02', 'DS-53010-03-03', 'DS-53010-03-04-XX'],
                        ['Order Inflow / Closure',  'DS-53010-04-01', 'DS-53010-04-02', 'DS-53010-04-03', 'DS-53010-04-04-XX'],
                        ['Maintenance & Execution', 'DS-53010-05-01', 'DS-53010-05-02', 'DS-53010-05-03', 'DS-53010-05-04-XX'],
                        ['Service Foundation',      'DS-53010-08-01', 'DS-53010-08-02', 'DS-53010-08-03', 'DS-53010-08-04-XX'],
                        ['Virtual Technician',      'DS-53010-09-01', 'DS-53010-09-02', 'DS-53010-09-03', 'DS-53010-09-04-XX'],
                        ['AI Big Bets',             'DS-53010-10-01', 'DS-53010-10-02', 'DS-53010-10-03', 'DS-53010-10-04-XX'],
                      ].map(([team, ...cols], i) => (
                        <tr key={team} className={i % 2 === 0 ? 'bg-white' : 'bg-gray-50/50'}>
                          <td className="px-3 py-2 border border-gray-200 font-medium text-gray-700">{team}</td>
                          {cols.map((c, j) => (
                            <td key={j} className={`px-3 py-2 border border-gray-200 font-mono ${c === '—' ? 'text-gray-300' : 'text-gray-700'}`}>{c}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </details>
            </section>
          )}

          {/* ── Footer ── */}
          <footer className="border-t border-gray-200 py-4">
            <div className="max-w-5xl mx-auto px-6 flex flex-wrap items-center justify-between gap-2 text-xs text-gray-400">
              <span>ExpenseWise v1.0 — Internal Use Only — April 2026</span>
              <span>7 Product Teams · 17 Form Fields · 3 Result Branches</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
